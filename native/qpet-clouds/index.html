<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>QQ企鹅穿云 · Q宠游戏</title><link rel="stylesheet" href="style.css"></head>
<body><main class="game-page"><header><a href="../">← 游戏大厅</a><h1>QQ企鹅穿云</h1><button id="sound-toggle" type="button" aria-pressed="false">声音：开</button><a href="../originals/#/play/classic-012" target="_blank" rel="noopener">原版对照</a></header>
<div class="stage-shell"><canvas id="game" width="800" height="600" tabindex="0" aria-label="QQ企鹅穿云游戏"></canvas><p id="loading" role="status">正在准备游戏…</p></div>
<p class="instruction">按空格起跳，看准角度继续跳跃；能量满后，连续按空格向上冲！</p><div class="touch-controls"><button id="space-button" type="button" aria-label="空格，跳跃">空格 · 跳跃</button></div><p id="error" role="alert" hidden></p>
<dialog id="score-dialog"><p>原积分服务暂不可用，本局分数已显示在游戏中。</p><button id="close-score" type="button">继续游戏</button></dialog></main><script type="module" src="app.js"></script></body></html>
