<main>
<header><h1>Q宠速配</h1><nav><button id="sound" type="button" aria-pressed="false">开启声音</button><!-- web-only:start --><a href="https://qpetlover.cn/QPetGames/#/play/classic-014" target="_blank" rel="noopener noreferrer">原版对照 ↗</a><!-- web-only:end --></nav></header>
