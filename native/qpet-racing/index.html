<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; base-uri 'none'">
<title>QQ飞车 · Q宠游戏</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<header><h1>QQ飞车</h1><nav><button id="sound" type="button" aria-pressed="false">开启声音</button><!-- web-only:start --><a href="../">游戏大厅</a><a href="../originals/#/play/classic-003" target="_blank" rel="noopener noreferrer">原版对照</a><!-- web-only:end --></nav></header>
<div id="stage"><canvas id="game" width="760" height="420" tabindex="0" role="img" aria-label="QQ飞车游戏画面">请使用支持Canvas的浏览器。</canvas><p id="loading" role="status">正在加载游戏…</p></div>
<div id="touch-controls" aria-label="触屏驾驶按键" hidden><div class="steer"><button type="button" data-key="ArrowLeft" aria-label="向左">◀</button><button type="button" data-key="ArrowRight" aria-label="向右">▶</button></div><button type="button" data-key="Control" class="item">道具</button><div class="speed"><button type="button" data-key="ArrowDown">减速</button><button type="button" data-key="ArrowUp">加速</button></div></div>

<p id="notice" role="status"></p><p id="status" class="sr-only" aria-live="polite"></p>
<div class="keyboard-controls" aria-label="游戏菜单"><button id="start" type="button">开始游戏</button><button id="help" type="button">游戏说明</button><button id="next" type="button" hidden>下一页</button><button id="back" type="button" hidden>返回菜单</button><button id="replay" type="button" hidden>再玩一次</button></div>
